[package]
name = "kaminari"
version = "0.28.1"
description = "Desktop anime app for PC. Tauri 2 plus Rust plus Svelte."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
getrandom = "0.3"
httpdate = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-libmpv = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream", "gzip", "blocking"] }
# Native startup dialogs before the Tauri event loop exists. The feature is
# already enabled by tauri-plugin-dialog's own rfd dependency.
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
# 0.41 pulls libsqlite3-sys 0.39, which bundles SQLite 3.54.0+ and fixes
# RUSTSEC-2026-0459 (CVE-2026-119375).
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "backup"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rquickjs = "0.8"
scraper = "0.20"
sha2 = "0.10"
hex = "0.4"
zip = "9"
thiserror = "2"
anyhow = "1"
url = "2"
# DPAPI for extension storage values. Already present transitively through
# Tauri; it is pinned here so the data-at-rest path does not add a new runtime.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
