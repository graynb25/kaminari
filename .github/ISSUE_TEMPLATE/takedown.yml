name: Takedown or legal request
description: Report material in this repository that should be removed or is linked incorrectly.
title: "[Takedown] "
body:
  - type: markdown
    attributes:
      value: |
        Kaminari ships no content, no source list, and no APKs. Use this form for a specific repository file, release asset, or link.

        Do not include government identity documents, passwords, private keys, or other sensitive personal data in a public issue. Ask for a private channel and the maintainer will move the conversation there.
  - type: input
    id: material
    attributes:
      label: Material URL or path
      description: The exact file, link, release asset, or issue that should be reviewed.
      placeholder: https://github.com/graynb25/kaminari/...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this material should be removed
      description: Explain the right that is affected and what outcome you want.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: A public way to reach you, or ask for a private channel here.
    validations:
      required: true
  - type: checkboxes
    id: good_faith
    attributes:
      label: Good faith
      options:
        - label: I have a good faith belief that the described use is not authorized by the rights holder, its agent, or the law.
          required: true
        - label: I understand this is a public issue unless the maintainer moves it to a private channel.
          required: true
